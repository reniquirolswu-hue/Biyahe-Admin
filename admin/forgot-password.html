<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIYAHE — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .recovery-form .btn-primary {
      position: relative;
      overflow: hidden;
    }
    .recovery-form .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    .recovery-form .btn-primary:hover::after {
      transform: translateX(100%);
    }
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid var(--brown-200);
      border-top-color: var(--brown-500);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .recovery-form.submitting .btn-primary span { display: none; }
    .recovery-form.submitting .loading-spinner { display: block; }
    .recovery-form .success-msg {
      display: none;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      border-left: 3px solid #2e7d32;
    }
    .recovery-form .success-msg.show { display: block; animation: fadeIn 0.4s ease; }
  </style>
</head>
<body>

<nav class="wayfind">
  <a href="index.html">Home</a>
  <a href="signup.html">Sign Up</a>
  <a href="login.html">Login</a>
</nav>

<div class="recovery-shell">
  <div class="recovery-card">
    <div class="recovery-mark" style="width:56px; height:56px; border-radius:50%; margin:0 auto 20px; background:var(--brown-100);"></div>
    <h2>Reset Password</h2>
    <p class="sub">Enter your email address and we'll send you a reset link.</p>

    <form class="recovery-form" id="resetForm" onsubmit="return handleReset(event)">
      <div id="resetSuccess" class="success-msg">✅ Reset link sent! Check your email.</div>
      
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <span class="icon">✉️</span>
          <input type="email" id="email" name="email" placeholder="admin@biyahe.com" autocomplete="email" required />
        </div>
      </div>

      <button type="submit" class="btn-primary" id="resetBtn">
        <span>Send Reset Link</span>
        <div class="loading-spinner"></div>
      </button>
    </form>

    <p class="divider-note"><a href="login.html">← Back to Login</a></p>
  </div>
</div>

<script>
function handleReset(event) {
  event.preventDefault();
  
  const form = document.getElementById('resetForm');
  const btn = document.getElementById('resetBtn');
  const successMsg = document.getElementById('resetSuccess');
  
  successMsg.classList.remove('show');
  form.classList.add('submitting');
  btn.disabled = true;
  
  setTimeout(() => {
    successMsg.classList.add('show');
    form.classList.remove('submitting');
    btn.disabled = false;
    
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2000);
  }, 1500);
  
  return false;
}
</script>

</body>
</html>
