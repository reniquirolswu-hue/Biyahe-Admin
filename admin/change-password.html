<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIYAHE — Change Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .change-form .btn-primary {
      position: relative;
      overflow: hidden;
    }
    .change-form .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    .change-form .btn-primary:hover::after {
      transform: translateX(100%);
    }
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid var(--brown-200);
      border-top-color: var(--brown-500);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .change-form.submitting .btn-primary span { display: none; }
    .change-form.submitting .loading-spinner { display: block; }
    .change-form .error-msg {
      display: none;
      background: #fef0ed;
      color: #d32f2f;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      border-left: 3px solid #d32f2f;
    }
    .change-form .error-msg.show { display: block; animation: shake 0.5s ease; }
    .change-form .success-msg {
      display: none;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      border-left: 3px solid #2e7d32;
    }
    .change-form .success-msg.show { display: block; animation: fadeIn 0.4s ease; }
  </style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark-sm">🚌</div>
      <div>
        <p class="brand-name-sm">BIYAHE</p>
        <span class="brand-sub">Transit Management</span>
      </div>
    </div>
    <nav class="side-nav">
      <a href="dashboard.html" class="side-link"><span class="side-icon">▦</span>Dashboard</a>
      <a href="analytics.html" class="side-link"><span class="side-icon">📊</span>Analytics</a>
      <a href="routes.html" class="side-link"><span class="side-icon">🛣️</span>Routes</a>
      <a href="settings.html" class="side-link is-active"><span class="side-icon">⚙️</span>Settings</a>
    </nav>
    <a href="login.html" class="side-logout">← Logout</a>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-welcome">
        <span class="lead">Welcome,</span>
        <strong>Administrator</strong>
      </div>
      <span class="region-badge">⭐ Cebu Network</span>
      <div class="topbar-search">
        🔍 <input type="text" placeholder="Search..." />
      </div>
      <button class="icon-btn">🔔</button>
      <a href="settings.html" class="admin-chip">
        <div>
          <p class="admin-name">Admin</p>
          <span class="admin-role">ADMIN</span>
        </div>
        <div class="avatar-circle">🧑</div>
      </a>
    </header>

    <main class="dash-content" style="justify-content:center; flex:1;">
      <div class="change-password-card">
        <h2>Change Password</h2>
        <p class="sub">Choose a new password for your account.</p>

        <form class="change-form" id="changeForm" onsubmit="return handleChange(event)">
          <div id="changeError" class="error-msg">⚠️ Passwords do not match!</div>
          <div id="changeSuccess" class="success-msg">✅ Password changed successfully!</div>
          
          <div class="field">
            <label for="current">Current Password</label>
            <div class="input-wrap">
              <span class="icon">🔒</span>
              <input type="password" id="current" name="current_password" placeholder="Enter current password" autocomplete="current-password" required />
            </div>
          </div>

          <div class="field">
            <label for="new">New Password <span class="req">min 8 chars</span></label>
            <div class="input-wrap">
              <span class="icon">🔒</span>
              <input type="password" id="new" name="new_password" placeholder="Enter new password" autocomplete="new-password" minlength="8" required />
            </div>
          </div>

          <div class="field">
            <label for="confirm">Confirm New Password</label>
            <div class="input-wrap">
              <span class="icon">🔁</span>
              <input type="password" id="confirm" name="confirm_password" placeholder="Re-enter new password" autocomplete="new-password" minlength="8" required />
            </div>
          </div>

          <button type="submit" class="btn-primary" id="changeBtn">
            <span>Update Password</span>
            <div class="loading-spinner"></div>
          </button>
        </form>

        <p class="divider-note"><a href="settings.html">← Back to Settings</a></p>
      </div>
    </main>
  </div>
</div>

<script>
function handleChange(event) {
  event.preventDefault();
  
  const current = document.getElementById('current').value;
  const newPass = document.getElementById('new').value;
  const confirm = document.getElementById('confirm').value;
  const errorMsg = document.getElementById('changeError');
  const successMsg = document.getElementById('changeSuccess');
  const form = document.getElementById('changeForm');
  const btn = document.getElementById('changeBtn');
  
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');
  
  if (newPass !== confirm) {
    errorMsg.classList.add('show');
    return false;
  }
  
  if (newPass.length < 8) {
    errorMsg.textContent = '⚠️ Password must be at least 8 characters!';
    errorMsg.classList.add('show');
    return false;
  }
  
  form.classList.add('submitting');
  btn.disabled = true;
  
  setTimeout(() => {
    successMsg.classList.add('show');
    form.classList.remove('submitting');
    btn.disabled = false;
    
    setTimeout(() => {
      window.location.href = 'settings.html';
    }, 1500);
  }, 1200);
  
  return false;
}
</script>

</body>
</html>
